on:
  pull_request: {}
  push:
    branches: [main]

env:
  NODE_VERSION: "20.18.0"

steps:
  - label: ":sparkles: Validate marketplace + wrapper script"
    key: validate
    command: |
      set -euo pipefail
      source .buildkite/setup-node.sh

      echo "--- :package: Install Claude Code CLI"
      npm install -g @anthropic-ai/claude-code
      claude --version

      echo "--- :white_check_mark: claude plugin validate ."
      claude plugin validate .

      echo "--- :nut_and_bolt: Structural lint (manifests, catalogs, skills)"
      node tests/lint_plugins.mjs

      echo "--- :shell: shellcheck wrapper + test"
      if ! command -v shellcheck >/dev/null 2>&1; then
        # Install shellcheck without sudo via a release tarball.
        SC_VERSION="v0.10.0"
        SC_DIR="$$HOME/shellcheck-$${SC_VERSION}"
        if [ ! -x "$$SC_DIR/shellcheck" ]; then
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$${SC_VERSION}/shellcheck-$${SC_VERSION}.linux.x86_64.tar.xz" \
            | tar -C /tmp -xJf -
          rm -rf "$$SC_DIR"
          mv "/tmp/shellcheck-$${SC_VERSION}" "$$SC_DIR"
        fi
        export PATH="$$SC_DIR:$$PATH"
      fi
      shellcheck plugins/chalk-lsp/bin/chalk-lsp.sh
      shellcheck tests/wrapper_test.sh
      shellcheck .buildkite/setup-node.sh
    agents:
      queue: default
    timeout_in_minutes: 5

  - label: ":mag: chalk-lsp wrapper gating tests"
    key: wrapper-tests
    command: |
      set -euo pipefail
      bash tests/wrapper_test.sh
    agents:
      queue: default
    timeout_in_minutes: 2

  - label: ":sparkles: Install plugins via Claude Code CLI"
    key: install-claude
    command: |
      set -euo pipefail
      source .buildkite/setup-node.sh

      echo "--- :package: Install Claude Code CLI"
      npm install -g @anthropic-ai/claude-code

      echo "--- :inbox_tray: Add local marketplace"
      claude plugin marketplace add "$$PWD"

      # Install every plugin registered in the Claude catalog, so a new
      # plugin can't merge if it fails to install.
      node -p "require('./.claude-plugin/marketplace.json').plugins.map(p => p.name).join('\n')" \
      | while read -r plugin; do
        echo "--- :inbox_tray: Install $$plugin@chalk-ai"
        claude plugin install "$$plugin@chalk-ai"
      done

      echo "--- :clipboard: claude plugin list"
      claude plugin list
    agents:
      queue: default
    timeout_in_minutes: 5

  - label: ":openai: Verify Codex marketplace parses"
    key: install-codex
    command: |
      set -euo pipefail
      source .buildkite/setup-node.sh

      echo "--- :package: Install Codex CLI"
      npm install -g @openai/codex
      codex --version

      echo "--- :inbox_tray: Add local marketplace"
      # If Codex can read .agents/plugins/marketplace.json without errors,
      # the catalog is well-formed. This is the install-time validation
      # available on Codex CLI versions that don't expose `plugin install`.
      codex plugin marketplace add "$$PWD"

      echo "--- :clipboard: codex plugin marketplace list"
      codex plugin marketplace list

      echo "--- :clipboard: codex plugin list"
      codex plugin list
    agents:
      queue: default
    timeout_in_minutes: 5
